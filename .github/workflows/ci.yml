name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch; tests use a stand-in backbone and no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Samples are reproducible
        run: |
          python scripts/make_samples.py --out /tmp/regen
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          from PIL import Image
          m = json.loads(Path("samples/manifest.json").read_text())
          worst = 0
          for s in m["surfaces"].values():
              for rel in s["train"] + [t["image"] for t in s["test"]] + [t["mask"] for t in s["test"] if t["mask"]]:
                  a = np.asarray(Image.open(f"samples/{rel}"), dtype=np.int16)
                  b = np.asarray(Image.open(f"/tmp/regen/{rel}"), dtype=np.int16)
                  worst = max(worst, int(np.abs(a - b).max()))
          print("largest pixel difference:", worst)
          assert worst <= 1
          PY
      - name: CLI smoke test
        run: |
          defect-inspector --version
          # a missing model file must fail with a clear message (exit 2)
          defect-inspector inspect samples/metal/test/good/000.png --model missing.npz || test $? -eq 2
